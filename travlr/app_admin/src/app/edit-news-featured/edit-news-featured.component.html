<div class="col-md-4">
    <h2 class="text-center">Edit Featured News</h2>
    <form *ngIf="editForm" [formGroup]="editForm" (ngSubmit)="onSubmit()">
       <div class="form-group">
        <label>Code:</label>
        <input type="text" formControlName="code"
          placeholder="Code" class="form-control"
          [ngClass]="{ 'is-invalid': submitted && f['code'].errors}">
        <div *ngIf="submitted && f['code'].errors">
            <div *ngIf="f['code'].errors?.['required']">
                News Code is required
            </div>
        </div>
       </div>
       <div class="form-group">
        <label>Title:</label>
        <input type="text" formControlName="title"
          placeholder="Title" class="form-control"
          [ngClass]="{ 'is-invalid': submitted && f['title'].errors}">
        <div *ngIf="submitted && f['title'].errors">
            <div *ngIf="f['title'].errors?.['required']">
                Title is required
            </div>
        </div>
       </div>
       <div class="form-group">
        <label>Author:</label>
        <input type="text" formControlName="author"
          placeholder="Author" class="form-control"
          [ngClass]="{ 'is-invalid': submitted && f['author'].errors}">
        <div *ngIf="submitted && f['author'].errors">
            <div *ngIf="f['author'].errors?.['required']">
                Author is required
            </div>
        </div>
       </div>
       <div class="form-group">
        <label>Published Date:</label>
        <input type="text" formControlName="pubDate"
          placeholder="pubDate" class="form-control"
          [ngClass]="{ 'is-invalid': submitted && f['pubDate'].errors}">
        <div *ngIf="submitted && f['pubDate'].errors">
            <div *ngIf="f['pubDate'].errors?.['required']">
                Published Date is required
            </div>
        </div>
       </div>
       <div class="form-group">
        <label>Description:</label>
        <input type="text" formControlName="description"
          placeholder="Description" class="form-control"
          [ngClass]="{ 'is-invalid': submitted && f['description'].errors }">
        <div *ngIf="submitted && f['description'].errors">
            <div *ngIf="f['description'].errors?.['required']">
                Description is required
            </div>
        </div>
       </div>
       <div class="form-group">
        <label>Image Name:</label>
        <input type="text" formControlName="image"
          placeholder="Image" class="form-control"
          [ngClass]="{ 'is-invalid': submitted && f['image'].errors}">
        <div *ngIf="submitted && f['image'].errors">
            <div *ngIf="f['image'].errors?.['required']">
                Image Name is required
            </div>
        </div>
        </div>
       <button type="submit" class="btn btn-info">Save</button>
    </form>
</div>
